name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q Scripts
      - name: Verify asset exclusion
        run: test -z "$(git ls-files Content Plugins | head -c 1)"
